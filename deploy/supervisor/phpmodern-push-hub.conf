; Supervisor equivalent of ../systemd/phpmodern-push-hub.service — for hosts
; where you have shell access but not systemd (some managed/shared hosting
; panels, containers using supervisord as PID 1, etc). Install to
; /etc/supervisor/conf.d/phpmodern-push-hub.conf, then:
;   supervisorctl reread && supervisorctl update && supervisorctl start phpmodern-push-hub

[program:phpmodern-push-hub]
; Edit this to match your deployment.
directory=/var/www/your-app
command=/usr/bin/php vendor/bin/hub.php 127.0.0.1 8081
user=www-data

; Same reasoning as the systemd unit: the hub holds every subscriber's
; connection in memory, so a crash should be recovered from automatically,
; not left down until someone notices.
autostart=true
autorestart=true
startsecs=2

stdout_logfile=/var/log/phpmodern-push-hub.log
stderr_logfile=/var/log/phpmodern-push-hub.error.log
